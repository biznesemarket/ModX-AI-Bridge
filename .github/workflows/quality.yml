name: Quality Gates

on:
  push:
  pull_request:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, pdo, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: composer validate --no-check-publish --strict
      - run: composer lint
      - run: composer verify-static-contract
      - run: composer test -- --testsuite unit,contract,security
      - run: composer test -- --testsuite sdk
      - run: ./scripts/sdk-typescript-check.sh

  modx-runtime:
    runs-on: ubuntu-latest
    needs: deterministic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, pdo, pdo_mysql
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: AIBRIDGE_RUNTIME=1 bash scripts/quality-gate.sh
