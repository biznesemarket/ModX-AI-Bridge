name: Quality Gates

on:
  push:
  pull_request:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, pdo, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: composer validate --no-check-publish --strict
      - run: composer lint
      - run: composer verify-static-contract
      - run: composer test -- --testsuite unit,contract,security
      - run: composer test -- --testsuite sdk
      - run: ./scripts/sdk-typescript-check.sh

  modx-runtime:
    runs-on: ubuntu-latest
    needs: deterministic
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, pdo, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: AIBRIDGE_RUNTIME=1 bash scripts/quality-gate.sh
