name: Quality Gates

on:
  push:
  pull_request:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, pdo, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer validate --no-check-publish --strict
      - run: composer lint
      - run: composer verify-static-contract
      - run: composer test -- --testsuite unit,contract,security

  modx-runtime:
    runs-on: ubuntu-latest
    needs: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, pdo, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: AIBRIDGE_RUNTIME=1 ./scripts/quality-gate.sh
