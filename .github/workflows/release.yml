name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql,dom,fileinfo,gd,json,simplexml,xml,xmlwriter,zip,zlib
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: bash scripts/quality-gate.sh
      - run: bash -n scripts/release-package.sh scripts/modx-install.sh scripts/test-modx.sh

  certify:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql,dom,fileinfo,gd,json,simplexml,xml,xmlwriter,zip,zlib
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: AIBRIDGE_RUNTIME=1 bash scripts/certification/stable-gate.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-evidence-${{ github.sha }}
          path: dist/**
          if-no-files-found: warn
          retention-days: 90

  package:
    needs: certify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql,dom,fileinfo,gd,json,simplexml,xml,xmlwriter,zip,zlib
      - run: composer install --no-interaction --prefer-dist
      - run: echo "Transport Package build is executed against a real MODX runtime in the integration release job; no package is published from a source-only runner."
