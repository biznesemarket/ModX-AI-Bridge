name: MODX Integration

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl,dom,fileinfo,gd,json,pdo,pdo_mysql,simplexml,xml,xmlwriter,zip,zlib
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer verify-static-contract
      - run: composer verify-generated-model
      - run: vendor/bin/phpunit

  modx:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/test-modx.sh
      - run: ./scripts/test-modx.sh
