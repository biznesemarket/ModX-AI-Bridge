name: MODX Integration

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: curl,dom,fileinfo,gd,json,pdo,pdo_mysql,simplexml,xml,xmlwriter,zip,zlib
          coverage: none
      - uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
      - run: composer verify-static-contract
      - run: composer verify-generated-model
      - run: vendor/bin/phpunit

  modx:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: bash scripts/test-modx.sh
