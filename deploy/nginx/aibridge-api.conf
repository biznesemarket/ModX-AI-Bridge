# AIBridge REST/MCP transport mapping (nginx).
#
# Include inside the server{} block that serves the MODX docroot.

location /api/ai/v2 {
    alias /var/www/html/assets/components/aibridge/api;
    index index.php;
    try_files $uri $uri/index.php /assets/components/aibridge/api/index.php$is_args$args;

    location ~ ^/api/ai/v2(/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/assets/components/aibridge/api/index.php;
        fastcgi_param PATH_INFO $1;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_IDEMPOTENCY_KEY $http_idempotency_key;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
