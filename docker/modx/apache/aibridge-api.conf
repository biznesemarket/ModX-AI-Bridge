# AIBridge REST/MCP transport mapping (directory policy).
#
# URL mapping to the front controller is performed by the vhost rewrite in
# docker/modx/apache/000-default.conf. The front controller performs
# authentication and the full security pipeline; the web server only maps URLs.

<Directory /var/www/html/assets/components/aibridge/api>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    AcceptPathInfo On
    DirectoryIndex index.php
    CGIPassAuth On
</Directory>
